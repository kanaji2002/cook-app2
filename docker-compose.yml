services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cookdb
      POSTGRES_USER: cookuser
      POSTGRES_PASSWORD: cookpass
    # ports: ← ★この行を削除！
    #   - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
